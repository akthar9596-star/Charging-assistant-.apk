name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Android Project Structure
        run: |
          if [ ! -d "android" ]; then
            echo "::error::Android project directory 'android' not found!"
            exit 1
          fi
          if [ ! -f "android/gradlew" ]; then
            echo "::error::Gradle wrapper 'android/gradlew' not found!"
            exit 1
          fi
          if [ ! -d "android/app" ]; then
            echo "::error::Application module 'android/app' not found!"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Executable Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Clean Stale Build Caches
        run: |
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf android/build

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        run: |
          APK_COUNT=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK files found in android/app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found $APK_COUNT debug APK file(s):"
          find android/app/build/outputs/apk/debug -name "*.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
